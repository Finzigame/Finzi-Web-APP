<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Aprende finanzas personales jugando." />

    <!-- PWA: permite "Agregar a pantalla de inicio" en Android y iPhone -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00CFFF" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finzi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #5ba4cf;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Pantalla de carga mientras baja el JS. React la reemplaza al montar la app. -->
    <style>
      .finzi-splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #00cfff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
      }
      .finzi-splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(9, 64, 105, 0.3);
        animation: finzi-bob 1.6s ease-in-out infinite;
      }
      .finzi-splash h1 {
        margin: 0;
        font-size: 40px;
        letter-spacing: 5px;
        font-weight: 800;
      }
      .finzi-splash p {
        margin: 0;
        font-size: 15px;
        opacity: 0.9;
      }
      .finzi-bar {
        width: 160px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      .finzi-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #ffffff;
        animation: finzi-slide 1.1s ease-in-out infinite;
      }
      @keyframes finzi-bob {
        50% { transform: translateY(-6px); }
      }
      @keyframes finzi-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .finzi-splash img,
        .finzi-bar::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      Necesitas activar JavaScript para usar Finzi.
    </noscript>
    <div id="root">
      <div class="finzi-splash" role="status" aria-live="polite">
        <img src="/icons/icon-192.png" alt="" />
        <h1>FINZI</h1>
        <div class="finzi-bar"></div>
        <p>Cargando…</p>
      </div>
    </div>
  </body>
</html>
